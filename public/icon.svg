<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a56d6" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Circle with Gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)" />
  <!-- Accent Inner Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" />
  <!-- Main Styled Icon Logo -->
  <g filter="url(#shadow)">
    <!-- Stylized Math/Science shape -->
    <path d="M160 300 L256 360 L352 300 L352 200 L256 140 L160 200 Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
    <path d="M160 200 L256 260 L352 200" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
    <path d="M256 260 L256 360" fill="none" stroke="#ffffff" stroke-width="8" />
    <!-- Floating orbital rings for science & math -->
    <ellipse cx="256" cy="250" rx="140" ry="48" fill="none" stroke="#38bdf8" stroke-width="6" transform="rotate(-30 256 250)" stroke-dasharray="8 6" />
    <ellipse cx="256" cy="250" rx="140" ry="48" fill="none" stroke="#a78bfa" stroke-width="6" transform="rotate(30 256 250)" />
    <!-- Center glowing nucleus -->
    <circle cx="256" cy="250" r="18" fill="#ffffff" />
  </g>
</svg>
